# Гейт стоит ДО коммита, а не после. Агент физически не может сохранить красное.
# Порядок от дешевого к дорогому: формат, потом типы, потом тесты.
#
# Одно исключение, и оно не послабление, а разрешение противоречия.
#
# Цикл качества устроен так: проверяющий, нашедший дефект, обязан доказать его
# ПАДАЮЩИМ тестом, и только потом исполнитель делает тест зеленым. Пока дефект
# не починен, тест красный по построению — это доказательство, а не поломка.
# Гейт же запрещает коммитить красное. Вместе эти два правила означают, что
# работу нельзя сохранить между «нашли» и «починили», а это ровно тот интервал,
# в котором живет весь цикл: после прогона 2 в репозитории висело двадцать два
# несохраненных изменения за два дня работы, и откатиться было не к чему.
#
# Поэтому доказательства дефектов вынесены из гейта в отдельный прогон
# (`npm run defects`). Гейт по-прежнему не пускает ни одной регрессии в
# работающем коде. Известный незакрытый дефект перестает блокировать сохранение
# и при этом остается красным и видимым — его считает судья цикла, а не гейт.
#
# Файлы доказательств именуются `defects-*.test.ts` или `*-defects-*.test.ts`.
# Имя — часть контракта: тест, названный иначе, попадает в гейт и обязан быть
# зеленым.

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: '*.{ts,tsx,json}'
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: typecheck
      run: npx tsc -b

    - name: tests
      run: npm run test:gate
