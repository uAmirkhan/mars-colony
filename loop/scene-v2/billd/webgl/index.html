<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Колония на Марсе</title>
  <style>
    /*
     * Дефолтный шаблон Unity зажимал сборку в прямоугольник 960 на 600 посреди
     * белой страницы, снизу вешал полосу с чужим логотипом и служебным именем
     * проекта. Первое, что видел открывший ссылку, — белые поля и бренд движка,
     * а не колония.
     *
     * Здесь канвас занимает страницу целиком, фон под цвет марсианской пыли,
     * поэтому дозагрузка не мигает белым.
     */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #6e4127;
    }

    #unity-container {
      position: absolute;
      inset: 0;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #6e4127;
    }

    /*
     * Полосу загрузки прячет сам загрузчик Unity, выставляя display: none.
     * Браузерная проверка ждет именно этого признака, поэтому имя и механика
     * сокрытия менялись быть не должны: `check-build.mjs` смотрит на
     * `#unity-loading-bar`.
     */
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      text-align: center;
      font: 500 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #f0dcc8;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 8px;
      margin-top: 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0;
      height: 100%;
      border-radius: 4px;
      background: #e8a33d;
      transition: width 0.15s linear;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: #ffd8a8;
      font: 500 13px/1.4 system-ui, sans-serif;
      display: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      Колония собирается
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      warningBanner.textContent = msg;
      warningBanner.style.display = "block";
      if (type !== "error") {
        setTimeout(function () {
          warningBanner.style.display = "none";
        }, 5000);
      }
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/webgl.data.unityweb",
      frameworkUrl: buildUrl + "/webgl.framework.js.unityweb",
      codeUrl: buildUrl + "/webgl.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Amirkhan",
      productName: "Колония на Марсе",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    // Канвас тянется за окном: ссылку откроют и с телефона, а фиксированные
    // 960 на 600 там дают полосы по краям и мелкую нечитаемую сцену.
    function fitCanvas() {
      canvas.width = Math.floor(window.innerWidth * (window.devicePixelRatio || 1));
      canvas.height = Math.floor(window.innerHeight * (window.devicePixelRatio || 1));
    }
    fitCanvas();
    window.addEventListener("resize", fitCanvas);

    var script = document.createElement("script");
    script.src = buildUrl + "/webgl.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function () {
        loadingBar.style.display = "none";
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
